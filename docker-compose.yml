version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVICES_AUTHENTICATION=local
      - SERVICES_DATABASE=local
      - SERVICES_FILESERVICE=local
      - SERVICES_IMAGEVALIDATIONSERVICE=local
      - SERVICES_LOGGINGSERVICE=local
      - DATABASE_DSN=bookstore.db
      - PORT=8080
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
